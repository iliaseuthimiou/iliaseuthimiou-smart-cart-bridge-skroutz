name: Confirm WordPress 7.2 compatibility

'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the verified readme-only change to WordPress.org
        type: boolean
        default: false

permissions: {}
concurrency:
  group: wporg-compatibility-7-2
  cancel-in-progress: false

jobs:
  metadata:
    if: github.repository == 'iliaseuthimiou/iliaseuthimiou-smart-cart-bridge-skroutz' && github.ref == 'refs/heads/main' && github.actor == 'iliaseuthimiou'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      WPORG_REPO: https://plugins.svn.wordpress.org/iliaseuthimiou-smart-cart-bridge-skroutz
    steps:
      - name: Verify and prepare the two readme files
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends subversion
          fi

          svn checkout --quiet --ignore-externals --non-interactive --no-auth-cache "$WPORG_REPO" "$RUNNER_TEMP/wporg-compat-7-2"
          cd "$RUNNER_TEMP/wporg-compat-7-2"

          python3 - <<'PY'
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          released = b"1.0.2"
          tested = re.compile(rb"^Tested up to:[ \t]*([^\r\n]+)", re.M | re.I)
          patches = {}
          for folder in ("trunk", "tags/1.0.2"):
              readme = Path(folder, "readme.txt")
              main = Path(folder, "iliaseuthimiou-smart-cart-bridge-skroutz.php")
              if readme.is_symlink() or main.is_symlink():
                  raise SystemExit(f"Unexpected symbolic link: {folder}")
              data = readme.read_bytes()
              stable = re.findall(rb"^Stable tag:[ \t]*([^\r\n]+)", data, re.M | re.I)
              version = re.findall(rb"^[ \t*]*Version:[ \t]*([^\r\n]+)", main.read_bytes()[:8192], re.M | re.I)
              if [x.strip() for x in stable] != [released] or [x.strip() for x in version] != [released]:
                  raise SystemExit(f"Release does not match 1.0.2: {folder}")
              matches = list(tested.finditer(data))
              if len(matches) != 1 or not re.fullmatch(rb"7\.(?:1(?:\.\d+)?|2)", matches[0][1].strip()):
                  raise SystemExit(f"Unexpected Tested up to header: {readme}")
              updated = tested.sub(b"Tested up to: 7.2", data, count=1)
              if updated != data:
                  patches[readme] = updated

          for readme, updated in patches.items():
              readme.write_bytes(updated)

          status = ET.fromstring(subprocess.check_output(["svn", "status", "--xml"]))
          actual = set()
          for entry in status.findall(".//entry"):
              state = entry.find("wc-status")
              if (
                  state is None
                  or state.get("item") != "modified"
                  or state.get("props") not in ("none", "normal")
                  or state.get("switched") == "true"
                  or state.get("tree-conflicted") == "true"
              ):
                  raise SystemExit("Unexpected SVN status; refusing to publish.")
              actual.add(Path(entry.attrib["path"]))
          if actual != set(patches):
              raise SystemExit("Unexpected SVN paths; refusing to publish.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("changed=" + str(bool(patches)).lower() + "\n")
          PY

          svn diff -- trunk/readme.txt tags/1.0.2/readme.txt

      - name: Publish the readme-only change to WordPress.org
        if: inputs.publish && steps.plan.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/wporg-compat-7-2
        shell: bash
        env:
          WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$WPORG_SVN_PASSWORD" ]]; then
            echo 'The temporary WPORG_SVN_PASSWORD repository secret is not available.'
            exit 1
          fi
          printf '%s\n' "$WPORG_SVN_PASSWORD" | env -u WPORG_SVN_PASSWORD svn commit \
            --non-interactive --no-auth-cache --password-from-stdin \
            --username iliaseuthimiou --message 'Confirm compatibility with WordPress 7.2' \
            -- trunk/readme.txt tags/1.0.2/readme.txt

      - name: Confirm both public SVN readmes
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          for path in trunk/readme.txt tags/1.0.2/readme.txt; do
            svn cat --non-interactive "$WPORG_REPO/$path" | tr -d '\r' | grep -Fx 'Tested up to: 7.2'
          done
