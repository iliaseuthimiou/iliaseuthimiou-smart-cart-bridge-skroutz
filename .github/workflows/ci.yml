name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production tree
        run: |
          mkdir -p build
          git archive --format=tar --prefix=iliaseuthimiou-smart-cart-bridge-skroutz/ HEAD | tar -x -C build

      - name: Run official Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/iliaseuthimiou-smart-cart-bridge-skroutz
          slug: iliaseuthimiou-smart-cart-bridge-skroutz
