name: Build release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate version and build ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          plugin_version="$(sed -n 's/^ \* Version:[[:space:]]*//p' smart-cart-bridge-for-skroutz.php | head -n 1)"
          if [ "$tag_version" != "$plugin_version" ]; then
            echo "Release tag $RELEASE_TAG does not match plugin version $plugin_version."
            exit 1
          fi
          git archive \
            --format=zip \
            --prefix=smart-cart-bridge-for-skroutz/ \
            --output="smart-cart-bridge-for-skroutz-${tag_version}.zip" \
            HEAD

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "smart-cart-bridge-for-skroutz-${tag_version}.zip" --clobber
